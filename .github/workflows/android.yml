name: Android app

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Complete generated Android project
        run: flutter create --platforms=android --org br.univesp --project-name monitor_ruido .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: monitor-ruido-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
