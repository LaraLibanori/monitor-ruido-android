name: iOS app

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Complete generated mobile projects
        run: flutter create --platforms=android,ios --org br.univesp --project-name monitor_ruido .

      - name: Configure local network permission
        run: bash "$GITHUB_WORKSPACE/scripts/configure_ios.sh"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: monitor-ruido-ios-build
          path: app/build/ios/iphoneos/Runner.app
